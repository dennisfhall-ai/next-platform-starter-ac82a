name: AutoLab Governed Executor

on:
  push:
    paths:
      - '.autolab-runs/**/RUN_READY'
  workflow_dispatch:
    inputs:
      run_id:
        description: Execution job id
        required: true
        type: string
      run_path:
        description: Relative path containing candidate source
        required: true
        type: string
      source_digest:
        description: Expected source bundle digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Checkout executor repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Resolve governed run
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_id='${{ inputs.run_id }}'
            run_path='${{ inputs.run_path }}'
            source_digest='${{ inputs.source_digest }}'
          else
            marker=$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" | grep -E '^\.autolab-runs/[^/]+/RUN_READY$' | head -n 1)
            test -n "$marker"
            run_path=${marker%/RUN_READY}
            run_id=${run_path##*/}
            source_digest=$(tr -d '\r\n' < "$marker")
          fi
          case "$run_path" in
            .autolab-runs/*) ;;
            *) echo "Unsafe run path" >&2; exit 20 ;;
          esac
          test -d "$run_path"
          test "$source_digest" != ""
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_path=$run_path" >> "$GITHUB_OUTPUT"
          echo "source_digest=$source_digest" >> "$GITHUB_OUTPUT"

      - name: Prepare disposable workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/autolab-workspace
          mkdir -p /tmp/autolab-workspace
          cp -a "${{ steps.resolve.outputs.run_path }}/." /tmp/autolab-workspace/
          rm -f /tmp/autolab-workspace/RUN_READY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: /tmp/autolab-workspace
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi

      - name: Typecheck
        working-directory: /tmp/autolab-workspace
        run: npm run typecheck --if-present

      - name: Build
        working-directory: /tmp/autolab-workspace
        run: npm run build

      - name: Lint
        working-directory: /tmp/autolab-workspace
        run: npm run lint --if-present

      - name: Tests
        working-directory: /tmp/autolab-workspace
        run: npm test --if-present

      - name: Emit evidence manifest
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          cat > evidence/result.json <<JSON
          {
            "run_id": "${{ steps.resolve.outputs.run_id }}",
            "source_digest": "${{ steps.resolve.outputs.source_digest }}",
            "runner": "github-hosted-ubuntu-latest",
            "permissions": "contents-read",
            "persist_credentials": false,
            "production_hardened": false,
            "network_isolation": false,
            "secrets_injected": false,
            "workflow_conclusion": "${{ job.status }}"
          }
          JSON

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autolab-evidence-${{ steps.resolve.outputs.run_id }}
          path: evidence/result.json
          if-no-files-found: error
          retention-days: 7
